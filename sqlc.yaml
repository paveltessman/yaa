version: "2"
sql:
  - engine: postgresql
    schema: migrations/sql
    queries:
      - platform/db/repos/tgupdates/tgupdates.sql
    gen:
      go:
        package: sqlc
        out: platform/db/internal/sqlc
        sql_package: pgx/v5
        output_db_file_name: db_sqlc.go
        output_models_file_name: models_sqlc.go
        output_files_suffix: _sqlc
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
