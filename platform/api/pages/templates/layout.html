{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<style>
body { font-family: ui-monospace, monospace; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
h1 { font-size: 1.2rem; }
a { color: #06c; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
th { background: #f4f4f4; }
pre { background: #f4f4f4; margin: 0; padding: 0.6rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
summary { cursor: pointer; }
.badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.badge { border: 1px solid #ccc; border-radius: 0.8rem; color: #444; font-size: 0.8rem; padding: 0.1rem 0.6rem; }
.entry { border-bottom: 1px solid #ddd; padding: 0.6rem 0; }
.entry > summary { display: flex; align-items: center; gap: 0.5rem; }
.entry-title { font-size: 1.1rem; }
.description { color: #444; margin: 0.6rem 0 0 1.2rem; }
.detail { margin: 0.4rem 0 0 1.2rem; }
.detail > summary { color: #06c; }
.detail > pre { margin-top: 0.3rem; }
.empty { color: #666; }
</style>
</head>
<body>
{{template "content" .}}
</body>
</html>
{{end}}
